<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Таск-Менеджер</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="container">
    <div id="tasks-tab" class="tab-content active">
      <h1 id="tasks-title">Задачи на сегодня</h1>
      <button class="btn" onclick="openNewTaskModal()">+ Новая задача</button>
      <div id="tasks-list" style="margin-top: 20px;"></div>
      <button class="btn btn-secondary" onclick="clearCompletedTasks()" style="margin-top: 20px;">Очистить выполненные</button>
    </div>

    <div id="calendar-tab" class="tab-content">
      <div class="calendar-header">
        <button class="calendar-nav-btn" onclick="previousMonth()">&#8249;</button>
        <h2 id="calendar-month-year"></h2>
        <button class="calendar-nav-btn" onclick="nextMonth()">&#8250;</button>
      </div>
      <button class="btn" onclick="openNewTaskModal()" style="width: 100%; margin-bottom: 16px;">+ Новая задача</button>
      <div class="calendar-grid" id="calendar-grid"></div>
      <div id="selected-day-tasks" style="margin-top: 20px;"></div>
    </div>

    <div id="settings-tab" class="tab-content">
      <h1>Настройки</h1>
      <div class="settings-item">
        <span id="theme-label">Тёмная тема</span>
        <label class="toggle-switch">
          <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <button class="btn clear-data-btn" onclick="clearAllData()">Очистить все данные</button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('tasks')">📋 Задачи</button>
    <button class="tab-btn" onclick="switchTab('calendar')">📅 Календарь</button>
    <button class="tab-btn" onclick="switchTab('settings')">⚙️ Настройки</button>
  </div>

  <!-- Slide Panel for New Task -->
  <div class="slide-panel-overlay" id="new-task-modal">
    <div class="slide-panel">
      <div class="slide-panel-header">
        <h2>Новая задача</h2>
        <button class="close-panel-btn" onclick="closeNewTaskModal()">✕</button>
      </div>
      <div class="slide-panel-content">
        <div class="form-group">
          <label for="task-title-input">Название задачи *</label>
          <input type="text" id="task-title-input" placeholder="Введите название">
        </div>
        <div class="form-group">
          <label for="task-date-input">Дата</label>
          <input type="date" id="task-date-input">
        </div>
        <div class="form-group">
          <label for="task-time-input">Время выполнения</label>
          <input type="time" id="task-time-input">
        </div>
        <div class="form-group">
          <label for="task-timer-input">Таймер (минуты)</label>
          <input type="number" id="task-timer-input" placeholder="0" min="0">
        </div>
        <div class="modal-buttons">
          <button class="btn btn-secondary" onclick="closeNewTaskModal()">Отмена</button>
          <button class="btn" onclick="createTask()">Создать</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Slide Panel for Task Detail -->
  <div class="slide-panel-overlay" id="task-detail-modal">
    <div class="slide-panel">
      <div class="slide-panel-header">
        <h2 id="task-detail-title">Название задачи</h2>
        <button class="close-panel-btn" onclick="closeTaskDetailModal()">✕</button>
      </div>
      <div class="slide-panel-content">
        <div class="task-detail-info">
          <p id="task-detail-date"></p>
          <p id="task-detail-time"></p>
          <p id="task-detail-timer"></p>
        </div>
        <div id="timer-display" class="timer-display" style="display: none;">
          <span class="timer-countdown" id="timer-countdown">00:00</span>
        </div>
        <div class="modal-buttons">
          <button class="btn btn-secondary" onclick="closeTaskDetailModal()">Закрыть</button>
          <button class="btn" id="start-timer-btn" onclick="startTimer()" style="display: none;">▶️ Запустить таймер</button>
          <button class="btn" id="stop-timer-btn" onclick="stopTimer()" style="display: none;">⏹️ Остановить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
